name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install truffleHog3 pytest
        
    - name: Run Secret and PII Scan
      run: |
        echo "Running secret scan using trufflehog3..."
        trufflehog3 --no-history .
        
    - name: Run Pytest
      run: |
        python -m pytest -q
        
    - name: Validate Logs
      run: |
        if [ -f data/logs.jsonl ]; then
          python scripts/validate_logs.py
        else
          echo "No logs found, skipping validate_logs.py"
        fi
        
    - name: Validate Dashboard
      run: |
        python scripts/validate_dashboard.py
