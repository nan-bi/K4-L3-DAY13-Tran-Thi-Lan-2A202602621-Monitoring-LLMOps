alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_p95 > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack-ai-alerts
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2%
    duration: 3m
    type: symptom-based
    channel: slack-ai-alerts
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2
  - name: degraded_retrieval_success
    severity: warning
    condition: retrieval_success_rate_pct < 90%
    duration: 5m
    type: symptom-based
    channel: slack-ai-alerts
    owner: oncall-rag
    runbook: docs/alerts.md#alert-3
